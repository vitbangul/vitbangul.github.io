<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Works</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .works-container {
      width: 100%;
    }

    .work-section {
      margin-bottom: 80px;
    }

    .work-title-section {
      margin-bottom: 20px;
    }

    .work-image {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>

  <main class="works-container">

    <div id="works"></div>

  </main>

  <script>

    fetch("works.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("works.json을 불러올 수 없습니다.");
        }
        return response.json();
      })

      .then(works => {

        const container = document.getElementById("works");

        works.forEach(work => {

          const section = document.createElement("div");
          section.className = "work-section";

          section.innerHTML = `
            
            <div class="work-title-section">

              <p>
                ${work.title}
                ${work.titleKr ? " " + work.titleKr : ""}
              </p>

              <p>${work.material}</p>

              <p>${work.size}</p>

              <p>${work.year}</p>

            </div>

            <div class="work-img-section">

              <img
                class="work-image"
                src="${work.image}"
                alt="${work.title}"
              >

            </div>

          `;

          container.appendChild(section);

        });

      })

      .catch(error => {

        console.error(error);

        document.getElementById("works").innerHTML = `
          <p>작품 데이터를 불러오지 못했습니다.</p>
        `;

      });

  </script>

</body>
</html>
